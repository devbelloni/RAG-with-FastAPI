[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-api"
version = "1.1.0"
description = "RAG question answering over PDFs with LangChain, ChromaDB and Groq"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Márcio Belloni" }]
dependencies = [
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-dotenv>=1.0",
    "langchain-core>=0.2", "langchain-community>=0.2", "langchain-groq>=0.1",
    "langchain-text-splitters>=0.2", "chromadb>=0.5", "pypdf>=4.0", "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
rag-api = "rag_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
